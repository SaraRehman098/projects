<!doctype html>
<html>
  <head>
    <!-- Title of the page -->
    <title>Student Information Table</title>
  </head>
  <body>
    <!-- Table to display student information with father name and class -->
    <!-- Black border style added using border attribute -->
    <table border="1">
      <!-- Table header row with column names -->
      <tr>
        <!-- Column 1: Name -->
        <th>Name</th>
        <!-- Column 2: Father Name -->
        <th>Father Name</th>
        <!-- Column 3: Class -->
        <th>Class</th>
      </tr>
      <!-- Sample data rows -->
      <tr>
        <!-- Student name -->
        <td>Ali</td>
        <!-- Father's name -->
        <td>Ahmed</td>
        <!-- Student's class -->
        <td>10th</td>
      </tr>
      <tr>
        <td>Sara</td>
        <td>Hassan</td>
        <td>9th</td>
      </tr>
      <tr>
        <td>Fatima</td>
        <td>Muhammad</td>
        <td>11th</td>
      </tr>
    </table>
  </body>
</html>
